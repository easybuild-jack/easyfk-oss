dromara:
  x-file-storage: #文件存储配置
    default-platform: amazon-s3-v2 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    amazon-s3-v2: # 基于 AWS SDK v2，同时兼容 MinIO、私有化 S3 等 S3 协议服务
      - platform: amazon-s3-v2 # 存储平台标识
        enable-storage: true  # 启用存储
        access-key: your-access-key
        secret-key: your-secret-key
        region: ap-east-1 # 区域；S3 兼容服务按其要求填写（多数填 us-east-1）
        end-point: https://s3.ap-east-1.amazonaws.com # 兼容 S3 的服务填其服务地址
        bucket-name: your-bucket
        domain: https://your-domain/bucket/ # 访问域名，注意“/”结尾，例如：http://minio.abc.com/abc/
        base-path: upload/ # 基础路径
