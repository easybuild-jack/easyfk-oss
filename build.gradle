//指定项目版本号和group
version = '3.5.16'
group = 'com.mcst'
apply plugin: 'java-library'
apply plugin: 'maven-publish'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
    implementation platform(libs.easyfkDependencies)
    constraints {
        // 框架 BOM 经 spring-cloud-dependencies 把 logging-interceptor 约束在 4.12.0，
        // 而 okhttp 实际解析为 4.12.1（minio 要求），此处对齐到同一版本
        implementation('com.squareup.okhttp3:logging-interceptor:4.12.1') {
            because 'okhttp 已升级到 4.12.1，拦截器需保持同一发行版本'
        }
    }
    compileOnly libs.lombok
    testCompileOnly libs.lombok
    annotationProcessor(libs.lombok, libs.processor)
    testAnnotationProcessor(libs.lombok, libs.processor)
    implementation("com.mcst:easyfk-core")
    implementation("com.mcst:log-log4j2")
    implementation("com.mcst:web-prd")
    implementation("com.mcst:cache-redis")
    implementation(libs.fileStorage) {
        // hutool-all（easyfk-core 引入）已包含全部 hutool 模块类，
        // 排除 x-file-storage 自带的 hutool-core 5.8.28，避免与 hutool-all 5.8.48 同名类重复
        exclude group: 'cn.hutool', module: 'hutool-core'
    }
    implementation(libs.tikaCore)
    implementation(libs.minio)
    implementation(libs.huawei)
    implementation(libs.aliyun)
    implementation(libs.qiniu)
    implementation(libs.s3)
    implementation(libs.baidu){
        exclude group: 'ch.qos.logback'
        exclude group: 'ch.qos.reload4j'
        // 百度 SDK 的 hadoop / hbase 适配依赖会拖入 hadoop 2.5.1、hbase 2.5.11、javax.servlet-api 2.5、
        // Jackson 1.x、Jersey 1.9、Guice 3.0 等与 Spring Boot 3.5（Jakarta EE 10）不兼容的旧包，BOS 客户端并不需要
        exclude group: 'org.apache.hadoop'
        exclude group: 'org.apache.hbase'
        exclude group: 'org.apache.hbase.thirdparty'
        // bce 携带 BC 1.59（jdk15on），与 aliyun SDK 的 bcprov-jdk18on 同包重复，保留新版
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        // commons-httpclient 3.1 已于 2011 年停止维护，仅被 com.baidubce.services.iotdmp.PlatformClient
        // （物联网平台客户端，与 BOS 对象存储无关）引用，BOS 相关类全部基于 httpclient 4.x，可安全排除
        exclude group: 'commons-httpclient', module: 'commons-httpclient'
    }
    implementation(libs.tencent) {
        // cos 自带 bcprov-jdk15on 1.70，与 aliyun SDK 的 bcprov-jdk18on 同包（org.bouncycastle.*）重复，保留新版
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
}
// 将依赖包复制到lib目录
tasks.register('copyJar', Copy) {
    // 清除现有的lib目录
    delete layout.buildDirectory.dir("libs/lib")
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir("libs/lib")
}

tasks.named('jar') {
    // 自定义jar包名称
    archiveFileName = 'easyfk-oss.jar'
    // lib目录的清除和复制任务
    dependsOn copyJar
    manifest {
        attributes(
                'Class-Path': configurations.runtimeClasspath.files.collect { "lib/$it.name" }.join(' '),
                'Main-Class': 'com.mcst.easyfk.oss.OssApp'
        )
    }
}

