//指定项目版本号和group
version = '3.2.12'
group = 'com.mcst'
apply plugin: 'java-library'
apply plugin: 'maven-publish'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
    implementation platform(libs.dependencies)
    compileOnly libs.lombok
    testCompileOnly libs.lombok
    annotationProcessor(libs.lombok, libs.processor)
    testAnnotationProcessor(libs.lombok, libs.processor)
    implementation("com.mcst:easyfk-core")
    implementation("com.mcst:log-log4j2")
    implementation("com.mcst:web-prd")
    implementation(libs.fileStorage)
    implementation(libs.minio)
    implementation(libs.huawei)
    implementation(libs.aliyun)
    implementation(libs.qiniu)
    implementation(libs.tencent)
    implementation(libs.baidu)
}
// 将依赖包复制到lib目录
tasks.register('copyJar', Copy) {
    // 清除现有的lib目录
    delete layout.buildDirectory.dir("libs/lib")
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir("libs/lib")
}

tasks.named('jar') {
    // 自定义jar包名称
    archiveFileName = 'mcstOss.jar'
    // lib目录的清除和复制任务
    dependsOn copyJar
    manifest {
        attributes(
                'Class-Path': configurations.runtimeClasspath.files.collect { "lib/$it.name" }.join(' '),
                'Main-Class': 'com.mcst.easyfk.oss.OssApp'
        )
    }
}

tasks.named('wrapper') {
    distributionUrl = 'https://services.gradle.org/distributions/gradle-8.7-bin.zip'
}
